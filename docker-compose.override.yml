# docker-compose.override.yml
# Auto-loaded by `docker compose up` for local development.
# Adds: hot-reload mounts, debug flags, exposed ports for debugging.

services:
  postgres:
    ports:
      - "6033:5432"

  ollama:
    ports:
      - "11434:11434"

  kafka:
    ports:
      - "9092:9092"
      - "29092:29092"   # for processes on the host, e.g. the API run with `npm run dev`
    environment:
      # Containers reach Kafka as kafka:9092. The host can't resolve "kafka", so a second
      # listener advertises localhost:29092 to clients outside Docker.
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_LISTENERS: 'PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092'

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    command: ["nodemon", "--watch", "src", "src/server.js"]
    volumes:
      - ./server/src:/app/src
      - ./uploads:/app/uploads

  whisper:
    environment:
      FLASK_ENV: development
      FLASK_DEBUG: "1"
      KAFKA_BROKERS: kafka:9092
    volumes:
      - ./whisper:/app
      - ./uploads:/app/uploads

  ocr:
    environment:
      FLASK_ENV: development
      FLASK_DEBUG: "1"
      KAFKA_BROKERS: kafka:9092
    volumes:
      - ./ocr:/app
      - ./uploads:/app/uploads
      - paddleocr_data:/root/.paddleocr

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    cpus: 1.0
    mem_limit: 512m
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    ports:
      - "5173:5173"
    environment:
      # Defaults to the API container. To use an API running on the host:
      #   VITE_API_TARGET=http://host.docker.internal:9088 docker compose up -d --force-recreate client
      VITE_API_TARGET: ${VITE_API_TARGET:-http://api:9088}
      VITE_USE_POLLING: "true"   # bind-mount file events are unreliable on macOS/Windows
    volumes:
      - ./client/src:/app/src
      - ./client/public:/app/public

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: expense-kafka-ui
    restart: always
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: expense-tracker
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
